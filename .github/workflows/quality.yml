name: Validate and deploy Grid Labs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify static entry points, local assets and JavaScript syntax
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/app.js
          test -f images/favicon.ico
          node --check js/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          class AssetReferences(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag in ('img', 'script'):
                      self.paths.append(attrs.get('src', ''))
                  elif tag == 'link':
                      self.paths.append(attrs.get('href', ''))
                  elif tag == 'a' and attrs.get('href', '').endswith('.html'):
                      self.paths.append(attrs['href'])

          parser = AssetReferences()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          missing = []
          for value in parser.paths:
              if not value or value.startswith(('#', 'data:', 'mailto:', 'tel:', '//')):
                  continue
              parsed = urlsplit(value)
              if parsed.scheme or parsed.netloc:
                  continue
              path = unquote(parsed.path)
              if path.startswith('/') or (path and not Path(path).is_file()):
                  missing.append(value)
          if missing:
              raise SystemExit('Missing or root-absolute local assets: ' + ', '.join(missing))
          print('HTML local assets verified')
          PY
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
